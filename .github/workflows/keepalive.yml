name: Keep Al-Manara Bridge Awake

# ريبو عام مخصص بس للطرقة دي، عشان GitHub Actions يبقى مجاني بلا حد أقصى
# (الحساب المجاني بيدي عدد دقائق محدود شهريًا للريبوهات الخاصة بس، لكن
# للريبوهات العامة الدقايق مجانية بلا حدود). الريبو ده مفيهوش أي بيانات
# حساسة، بس بيطرق رابط صحة الخدمة كل 5 دقايق عشان Render متنيمهاش
# (بتنيّم الخدمة المجانية بعد 15 دقيقة سكون، فالطرقة كل 5 دقايق بتمنع
# السكون دا خالص).
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check
        run: curl -sf --max-time 20 https://al-manara-tg-wa-bridge.onrender.com/ || true
