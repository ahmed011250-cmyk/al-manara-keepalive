name: Keep Al-Manara Bridge Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health check and verify the bridge is fully connected
        run: |
          body="$(curl -sf --max-time 20 https://al-manara-tg-wa-bridge.onrender.com/)"
          echo "$body"
          tg=$(echo "$body" | jq -r '.telegram')
          wa=$(echo "$body" | jq -r '.whatsapp')
          if [ "$tg" != "connected" ] || [ "$wa" != "connected" ]; then
            echo "::error::الجسر مش شغال بالكامل - telegram=$tg whatsapp=$wa"
            exit 1
          fi
          echo "كل حاجة شغالة: telegram=$tg whatsapp=$wa"
