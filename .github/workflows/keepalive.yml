name: Keep Al-Manara Bridge Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake up + verify the bridge is fully connected
        run: |
          # محتاجين مهلة أطول من 20 ثانية عشان لو Render كان نايم (cold start)
          # ممكن ياخد وقت أطول عشان يصحى، ولو فشلنا هنا الخدمة تفضل نايمة.
          body="$(curl -sf --max-time 60 --retry 3 --retry-delay 5 https://al-manara-tg-wa-bridge.onrender.com/)"
          echo "$body"
          tg=$(echo "$body" | jq -r '.telegram')
          wa=$(echo "$body" | jq -r '.whatsapp')
          if [ "$tg" != "connected" ] || [ "$wa" != "connected" ]; then
            echo "::error::الجسر مش شغال بالكامل - telegram=$tg whatsapp=$wa"
            exit 1
          fi
          echo "كل حاجة شغالة: telegram=$tg whatsapp=$wa"
